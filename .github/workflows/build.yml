name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Re-pushing a tag / re-dispatching while a run is active supersedes it —
# don't burn 4 parallel runners on a dead run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # Built on the oldest supported Ubuntu LTS so the AppImage only needs
    # glibc 2.35 on the host (AppImage catalog requirement). GTK4/libadwaita
    # are too old there, so they're built from source and cached.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 90
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      PKG_CONFIG_PATH: /opt/gnome/lib/x86_64-linux-gnu/pkgconfig:/opt/gnome/lib/pkgconfig:/opt/gnome/share/pkgconfig
      LD_LIBRARY_PATH: /opt/gnome/lib/x86_64-linux-gnu:/opt/gnome/lib
      XDG_DATA_DIRS: /opt/gnome/share:/usr/share
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq build-essential curl wget git file xz-utils pkg-config python3-pip             ninja-build flex bison gettext sassc cmake libffi-dev zlib1g-dev libpcre2-dev libmount-dev             libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libgraphene-1.0-dev libepoxy-dev             libfribidi-dev libharfbuzz-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev             wayland-protocols libx11-dev libxext-dev libxi-dev libxrandr-dev libxcursor-dev             libxdamage-dev libxinerama-dev libxfixes-dev libxml2-dev libyaml-dev libcurl4-gnutls-dev             libstemmer-dev libdrm-dev libexpat1-dev xsltproc docbook-xsl librsvg2-dev librsvg2-common gperf itstool desktop-file-utils appstream >/dev/null
          pip3 install -q 'meson>=1.4' packaging
      - uses: actions/checkout@v4
      - name: Restore GNOME stack cache
        id: gnome-cache
        uses: actions/cache@v4
        with:
          path: /opt/gnome
          key: gnome-jammy-${{ hashFiles('packaging/appimage/build-gnome-deps.sh') }}
      - name: Build GLib / GTK4 / libadwaita
        if: steps.gnome-cache.outputs.cache-hit != 'true'
        run: bash ./packaging/appimage/build-gnome-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O /tmp/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/appimagetool /tmp/linuxdeploy /tmp/linuxdeploy-plugin-gtk.sh
          mkdir -p packaged
          PATH="/tmp:/opt/gnome/bin:$PATH" APPIMAGETOOL=/tmp/appimagetool LINUXDEPLOY=/tmp/linuxdeploy ./packaging/build-appimage.sh ./packaged
          ls -lh packaged/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaged/*.AppImage

  # Smoke test on the same base the AppImage catalog tests on: only base
  # desktop libs (X11/GL/fonts/harfbuzz, which AppImages take from the host),
  # no GTK/libadwaita. Every bundled library and glibc symbol must resolve.
  appimage-check:
    needs: appimage
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libx11-6 libxcb1 libgl1 libegl1 libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 >/dev/null
          chmod +x legion-control-*.AppImage && ./legion-control-*.AppImage --appimage-extract >/dev/null
          cd squashfs-root && for b in usr/bin/legion-settings usr/bin/legion-cli usr/bin/legion-daemon; do
            echo "== $b"; LD_LIBRARY_PATH=$PWD/usr/lib ldd "$b" 2>&1 | tee /tmp/ldd.txt
            if grep -q "not found" /tmp/ldd.txt; then echo "missing libs or glibc symbols in $b"; exit 1; fi
          done

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Cargo registry + build target, bind-mounted into the container.
      # Registry contents only change with Cargo.lock, hence the lock hash key.
      - name: Restore cargo cache (rustup + registry + target)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/deb/cargo
            .ci-cache/deb/rustup
            .ci-cache/deb/target
          key: deb-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: deb-${{ runner.os }}-
      - run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          OUT=$(pwd)/packaging/out; mkdir -p $OUT; WORK=$(mktemp -d); trap "rm -rf $WORK" EXIT
          SOURCE="$WORK/legion-control-$VERSION.tar.gz"
          tar --exclude='./target' --exclude='./packaging/out' --exclude='./.git' --exclude='./.ci-cache' --transform="s,^\.,legion-control-$VERSION," -czf "$SOURCE" -C . .
          # The target dir is mounted at the extracted tree's ./target so
          # packaging/debian/build.sh keeps finding target/release/*.
          docker run --rm \
            -v "$SOURCE:/input/legion-control-$VERSION.tar.gz:ro" -v "$OUT:/out" \
            -v "$(pwd)/.ci-cache/deb/cargo:/root/.cargo" \
            -v "$(pwd)/.ci-cache/deb/rustup:/root/.rustup" \
            -v "$(pwd)/.ci-cache/deb/target:/tmp/legion-control-$VERSION/target" \
            ubuntu:24.04 bash -lc "
              set -e; export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq; apt-get install -y -qq build-essential curl pkg-config dpkg-dev libgtk-4-dev libadwaita-1-dev >/dev/null
              export RUSTUP_HOME=/root/.rustup CARGO_HOME=/root/.cargo
              # --profile minimal skips the ~500MB rust-docs component;
              # with the cached RUSTUP_HOME this is a fast no-op on hits.
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null; . /root/.cargo/env
              tar -xzf /input/legion-control-$VERSION.tar.gz -C /tmp; cd /tmp/legion-control-$VERSION
              cargo build --release --locked; chmod +x packaging/debian/build.sh; OUT_DIR=/out packaging/debian/build.sh
            "
          ls -lh packaging/out/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packaging/out/*.deb

  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore cargo cache (registry + target)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/rpm/cargo
            .ci-cache/rpm/target
          key: rpm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rpm-${{ runner.os }}-
      - run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          OUT=$(pwd)/packaging/out; mkdir -p $OUT; WORK=$(mktemp -d); trap "rm -rf $WORK" EXIT
          SOURCE="$WORK/legion-control-$VERSION.tar.gz"
          tar --exclude='./target' --exclude='./packaging/out' --exclude='./.git' --exclude='./.ci-cache' --transform="s,^\.,legion-control-$VERSION," -czf "$SOURCE" -C . .
          # CARGO_TARGET_DIR keeps the cache outside the rpmbuild tree —
          # %autosetup rm -rf's the BUILD dir, which would kill a mount there.
          # The spec's %install honors CARGO_TARGET_DIR (see legion-control.spec).
          docker run --rm \
            -v "$SOURCE:/input/legion-control-$VERSION.tar.gz:ro" -v "$OUT:/out" \
            -v "$(pwd)/.ci-cache/rpm/cargo:/root/.cargo" \
            -v "$(pwd)/.ci-cache/rpm/target:/tmp/target" \
            fedora:42 bash -lc "
              set -e; export CARGO_TARGET_DIR=/tmp/target
              dnf install -y -q --setopt=install_weak_deps=False rpm-build cargo rust gtk4-devel libadwaita-devel systemd-devel systemd-rpm-macros >/dev/null
              mkdir -p /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              cp /input/legion-control-$VERSION.tar.gz /tmp/rpmbuild/SOURCES/; cp /input/legion-control-$VERSION.tar.gz /tmp/source.tar.gz
              tar -xzf /tmp/source.tar.gz -C /tmp; cp /tmp/legion-control-$VERSION/packaging/rpm/legion-control.spec /tmp/rpmbuild/SPECS/
              rpmbuild -bb /tmp/rpmbuild/SPECS/legion-control.spec --define '_topdir /tmp/rpmbuild'; cp /tmp/rpmbuild/RPMS/*/*.rpm /out/
            "
          ls -lh packaging/out/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: packaging/out/*.rpm

  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore cargo cache (registry + target)
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/arch/cargo
            .ci-cache/arch/target
          key: arch-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: arch-${{ runner.os }}-
      - run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          OUT=$(pwd)/packaging/out; mkdir -p $OUT; WORK=$(mktemp -d); trap "rm -rf $WORK" EXIT
          SOURCE="$WORK/legion-control-$VERSION.tar.gz"
          tar --exclude='./target' --exclude='./packaging/out' --exclude='./.git' --exclude='./.ci-cache' --transform="s,^\.,legion-control-$VERSION," -czf "$SOURCE" -C . .
          # Cache lives outside the makepkg srcdir (--cleanbuild wipes it);
          # PKGBUILD honors CARGO_TARGET_DIR in build()/package().
          docker run --rm \
            -v "$SOURCE:/input/legion-control-$VERSION.tar.gz:ro" -v "$OUT:/out" \
            -v "$(pwd)/packaging/arch:/packaging:ro" \
            -v "$(pwd)/.ci-cache/arch/cargo:/home/builder/.cargo" \
            -v "$(pwd)/.ci-cache/arch/target:/build/cargo-target" \
            archlinux:latest bash -lc "
              set -e
              pacman -Syu --needed --noconfirm base-devel rust gtk4 libadwaita polkit >/dev/null
              useradd -m builder; mkdir -p /build; cp /input/legion-control-$VERSION.tar.gz /build/; cp /packaging/PKGBUILD /packaging/legion-control.install /build/
              chown -R builder:builder /build /home/builder/.cargo /build/cargo-target
              cd /build && runuser -u builder -- env CARGO_TARGET_DIR=/build/cargo-target makepkg --noconfirm --cleanbuild --nocheck
              cp /build/*.pkg.tar.zst /out/
            "
          ls -lh packaging/out/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/out/*.pkg.tar.zst

  release:
    needs: [appimage, appimage-check, deb, rpm, arch]
    # Only publish on tag pushes — a workflow_dispatch from master must not
    # create a stray "master" release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          body_path: docs/changelog/${{ github.ref_name }}.md
