services:
  telemetry:
    build: .
    container_name: legion-telemetry-go
    restart: unless-stopped
    ports:
      - "127.0.0.1:8791:8791"
      - "${LEGION_PORTAL_BIND:-127.0.0.1}:8788:8788"
    volumes:
      - telemetry-data:/data
    environment:
      - LEGION_TELEMETRY_DB=/data/diagnostics.db
      - LEGION_TELEMETRY_KEY=${LEGION_TELEMETRY_KEY}
      - LEGION_INGEST_PORT=8791
      - LEGION_PORTAL_PORT=8788
      - LEGION_SERVER_MODE=all

volumes:
  telemetry-data:
