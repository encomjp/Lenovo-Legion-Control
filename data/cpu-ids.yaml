# Laptop CPU marketing names keyed by SKU token from /proc/cpuinfo.
#
# /proc/cpuinfo is usually already a marketing string plus junk
# ("16-Core Processor", Intel(R), Core(TM)). We match the longest SKU
# token (9955HX3D, 14700HX, HX 370) and emit a short pretty name.
# CPUID family/model is shared across many SKUs, so it is not the key.
#
# Add a row when a Lenovo laptop shows a raw model name we do not map.

