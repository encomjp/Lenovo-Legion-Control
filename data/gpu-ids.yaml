# Laptop GPU marketing names keyed by PCI device ID.
#
# Used when nvidia-smi is asleep/missing. lspci dumps chip + Max-Q tags;
# this map turns 10de:2c19 into "NVIDIA GeForce RTX 5080 Laptop GPU".
#
# Vendor is the section name (nvidia → 10de, amd → 1002).
# IDs are hex without 0x. Same chip often has several IDs (M vs BM, OEM).
# TGP still comes from nvidia-smi / PSREF — PCI ID cannot tell 80W from 175W.
#
# Sources: pci.ids (hwdata), NVIDIA mobile PCI ID lists, Lenovo PSREF SKUs.
# Add a row when a new laptop ID shows up as "NVIDIA GPU (10de:xxxx)".

